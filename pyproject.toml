[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalwave"
version = "0.2.0"
description = "线性耦合传播方程的因果数值求解：marcher、GEM专用IF2与XMDS2接口"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "DeconBear"}]
dependencies = ["numpy>=2.0", "scipy>=1.13.1"]
keywords = ["linear-pde", "causal-propagation", "Maxwell-Bloch", "exponential-integrator", "XMDS2"]

[project.urls]
Homepage = "https://deconbear.github.io/causalwave/"
Repository = "https://github.com/DeconBear/causalwave"
Issues = "https://github.com/DeconBear/causalwave/issues"

[project.optional-dependencies]
test = ["pytest>=8", "build>=1"]
plot = ["matplotlib>=3.7"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "pymdown-extensions>=10"]

[project.scripts]
causalwave = "causalwave.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
causalwave = ["templates/*.xmds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["xmds: 需要系统XMDS2与C++工具链的集成测试"]
